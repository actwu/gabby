<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabby — Real-Time Navigation AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://cdn.jsdelivr.net/npm">
  
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface">
  
<style>
:root {
  --bg:#000; --muted:#b6b6b6; --text:#fff;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
  
*:not([scroll]) {
scrollbar-width: none;
}

:not([scroll])::-webkit-scrollbar {
display: none;
}

  
body {
max-width: 787px;
 margin:auto;
   place-self:center;
}
html, body {height:100%;  background:var(--bg); color:var(--muted);}
* {box-sizing:border-box;}
#loader {position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,1); z-index:9999;}
.loader-box {display:flex; flex-direction:column; align-items:center; gap:10px;}
.logo-G {font-size:72px; font-weight:800; color:var(--text); opacity:0.3; animation:logoBubble 1.8s cubic-bezier(.68,-0.55,.27,1.55) forwards;}
.loader-tag {font-size:18px; color:var(--muted); opacity:0; animation:tagFadeIn 0.8s ease forwards; animation-delay:1.8s;}
@keyframes logoBubble {0% {transform:scale(0.5) translateY(0); opacity:0.3;} 50% {transform:scale(1.2) translateY(-10px); opacity:0.6;} 100% {transform:scale(1) translateY(0); opacity:1;}}
@keyframes tagFadeIn {from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);}}
@keyframes loaderExit {from {transform:translateY(0); opacity:1;} to {transform:translateY(-50px); opacity:0;}}

.app-shell {
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100%;
}

.video-wrap, .chat-wrap {
  flex:1;
  min-height:20%;
  max-height:80%;
  transition:flex 0.4s ease, min-height 0.4s ease, max-height 0.4s ease;
  cursor:pointer;
}

.video-wrap.expanded {
  flex:4;
  min-height:80%;
  max-height:100%;
}

.chat-wrap.expanded {
  flex:4;
  min-height:80%;
  max-height:100%;
}

.video-wrap {position:relative; margin:10px; border-radius:15px; overflow:hidden; background:#111;}
video, canvas {width:100%; height:100%; object-fit:cover; border-radius:15px; position:absolute; top:0; left:0;}
.watermark {position:absolute; top:10px; left:10px; font-weight:700; font-size:24px; color:#fff; opacity:0.5; pointer-events:none;}
.messages {flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; padding:4px;}
.bubble {padding:10px 14px; border-radius:14px; max-width:85%; line-height:1.35;}
.bubble.gabby {align-self:flex-start; background:rgba(255,255,255,0.05); color:var(--muted);}
.bubble.user {align-self:flex-end; background:#222; color:#fff;}
.chat-wrap {display:flex; flex-direction:column; border-top:1px solid #222; padding:8px; overflow:hidden;}
.action-buttons {position:absolute; bottom:20px; right:20px; display:flex; gap:10px;}
.action-buttons button {background:var(--text); color:#000; border:none; border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.5);}
.action-buttons .material-icons {font-size:32px;}
#awakeDot {position:absolute; top:20px; left:20px; width:16px; height:16px; border-radius:50%; background:blue; box-shadow:0 0 8px blue; opacity:0;}
</style>
</head>
<body>

<div id="loader" style="display: none;">
  <div class="loader-box" id="loaderBox" style="animation: 0.6s ease 0s 1 normal forwards running loaderExit;">
    <div class="logo-G" id="logoG">G</div>
    <div class="loader-tag">Gabby ang ’yong gabay</div>
  </div>
</div>

<div class="app-shell" id="app">
  <div class="video-wrap expanded" id="videoWrap">
    <video id="camera" autoplay="" playsinline="" muted=""></video>
    <canvas id="overlay" width="640" height="480"></canvas>
    <div class="watermark">G</div>
    <div id="awakeDot" class="ready"></div>
    <div class="action-buttons">
      <button id="toggleScan"><span class="material-icons">pause</span></button>
    </div>
  </div>
  <div class="chat-wrap" id="chatWrap" aria-live="polite">
    <div class="messages" id="messages"><div class="bubble gabby">I woke up, nai!</div><div class="bubble gabby">Back camera activated!</div><div class="bubble gabby">Scanning paused ([object PointerEvent]).</div><div class="bubble gabby">Scanning resumed ([object PointerEvent]).</div><div class="bubble gabby">COCO + Face model loaded!</div></div>
  </div>
</div>

<!-- AI Models -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

<script>
// Loader animation
const loader = document.getElementById('loader');
const loaderBox = document.getElementById('loaderBox');
setTimeout(() => {
  loaderBox.style.animation = 'loaderExit 0.6s forwards';
  loaderBox.addEventListener('animationend', () => loader.style.display='none');
}, 3000);

// Chat bubbles
const messages = document.getElementById('messages');
function addBubble(text, who='gabby') {
  const b = document.createElement('div');
  b.className = 'bubble '+who;
  b.textContent = text;
  messages.appendChild(b);
  messages.scrollTop = messages.scrollHeight;
}

// Greeting
let userName = localStorage.getItem('userName');
if(!userName){
  userName = prompt("Hello! What's your name?");
  localStorage.setItem('userName', userName || "User");
}
addBubble(`I woke up, ${userName}!`, "gabby");

// Expand/collapse logic
const videoWrap = document.getElementById('videoWrap');
const chatWrap = document.getElementById('chatWrap');

videoWrap.addEventListener('click', () => {
  videoWrap.classList.add('expanded');
  chatWrap.classList.remove('expanded');
});

chatWrap.addEventListener('click', () => {
  chatWrap.classList.add('expanded');
  videoWrap.classList.remove('expanded');
});

// Video & Canvas
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const awakeDot = document.getElementById('awakeDot');

let cocoModel, faceModel;
let scanning = true;
let speaking = false;

// Start AI
async function startAI() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    awakeDot.classList.add('ready');
    addBubble("Back camera activated!", "gabby");
  } catch(err){
    console.error("Camera error:", err);
    addBubble("Cannot access camera 😢", "gabby");
    return;
  }

  cocoModel = await cocoSsd.load({base:'lite_mobilenet_v2'});
  faceModel = await blazeface.load();

  addBubble("COCO + Face model loaded!", "gabby");
  detectFrame();
}

// Toggle scanning
document.getElementById('toggleScan').addEventListener('click', toggleScanning);
function toggleScanning(from="button") {
  scanning = !scanning;
  video.paused ? video.play() : video.pause();
  document.getElementById('toggleScan').innerHTML =
    `<span class="material-icons">${video.paused ? 'play_arrow' : 'pause'}</span>`;
  addBubble(scanning ? `Scanning resumed (${from}).` : `Scanning paused (${from}).`, "gabby");
  const utter = new SpeechSynthesisUtterance(scanning ? "Scanning resumed" : "Scanning paused");
  speechSynthesis.speak(utter);
}

// Draw overlay
function drawOverlay(predictions){
  if(video.videoWidth && video.videoHeight){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);

  predictions.forEach(p => {
    if(p.score < 0.5) return;
    const isObstacle = obstacleClasses.includes(p.class);
    ctx.strokeStyle = isObstacle ? "rgba(255,0,0,0.8)" : "rgba(0,0,255,0.6)";
    ctx.lineWidth = 3;
    ctx.strokeRect(...p.bbox);

    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = '18px Poppins';
    ctx.fillText(`${p.class} ${(p.score*100).toFixed(1)}%`,
                 p.bbox[0], p.bbox[1] > 20 ? p.bbox[1]-5 : 10);
  });
}

// Obstacle classes
const obstacleClasses = [
  "person","car","bus","truck","bicycle","motorcycle","bench","chair","couch",
  "potted plant","bed","dining table","tv","refrigerator","door","wall","sink","face"
];

// Guidance
function giveGuidance(predictions){
  if(speaking) return;
  const obstacles = predictions.filter(p=>p.score>=0.5 && obstacleClasses.includes(p.class));
  if(!obstacles.length) return;
  speaking = true;

  const instructions = [];
  obstacles.forEach(p=>{
    const xCenter = p.bbox[0] + p.bbox[2]/2;
    let dir = 'ahead';
    if(xCenter < canvas.width/3) dir = 'on your right';
    else if(xCenter > 2*canvas.width/3) dir = 'on your left';

    let warning = '';
    if(Math.max(p.bbox[2], p.bbox[3]) > 150) warning = ', it is close';

    instructions.push(`Caution: ${p.class} ${dir}${warning}.`);
  });

  instructions.forEach((instr, i)=>{
    setTimeout(()=>{
      const utter = new SpeechSynthesisUtterance(instr);
      speechSynthesis.speak(utter);
      navigator.vibrate([200,100,200]);
    }, i*2500);
  });

  setTimeout(()=>speaking=false, instructions.length*2500);
}

// Frame detection
async function detectFrame(){
  if(!scanning) return requestAnimationFrame(detectFrame);

  const cocoPreds = await cocoModel.detect(video);
  const faces = await faceModel.estimateFaces(video, false);

  const facePreds = faces.map(f => ({
    class: "face",
    score: f.probability ? f.probability[0] : 0.99,
    bbox: [
      f.topLeft[0],
      f.topLeft[1],
      f.bottomRight[0]-f.topLeft[0],
      f.bottomRight[1]-f.topLeft[1]
    ]
  }));

  const predictions = [...cocoPreds, ...facePreds];

  drawOverlay(predictions);
  giveGuidance(predictions);

  requestAnimationFrame(detectFrame);
}

startAI();
</script>


</body></html>
